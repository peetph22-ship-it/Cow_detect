# บริการสำหรับรันในเครื่อง (หลังบ้าน Python FastAPI เดิมถูกเอาออกแล้ว ระบบจริงใช้ backend_node บน Render)
services:
  backend_node:
    build: ./backend_node
    container_name: cow_detect_node
    ports:
      - "4001:4001"
    dns:
      - 10.1.254.2
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "aws-0-ap-southeast-2.pooler.supabase.com:13.238.183.126"
    env_file: 
      - ./backend_node/.env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./backend_node:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    networks:
      - app-network
    restart: always

  frontend:
    build: ./frontend
    container_name: cow_detect_frontend
    ports: ["3000:3000"]
    environment: 
      - PORT=3000
      - NODE_ENV=development
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - NUXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NUXT_PUBLIC_SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./frontend/.env
    networks:
      - app-network
    restart: always
  
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cow_detect_tunnel
    restart: always
    command: tunnel --no-autoupdate run
    # token อยู่ใน .env (CLOUDFLARE_TUNNEL_TOKEN) ห้ามเขียนลงไฟล์นี้
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge