services:
  backend: 
    build: ./backend
    container_name: cow_detect_backend
    ports: ["8000:8000"]
    env_file: 
      - ./backend/.env
    environment:
      - PORT=8000
    volumes:
      - ./backend:/app
      - ./backend/app/weights:/app/app/weights
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - app-network
    restart: always
  
  backend_node:
    build: ./backend_node
    container_name: cow_detect_node
    ports:
      - "4001:4001"
    env_file: 
      - ./backend_node/.env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./backend_node:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    networks:
      - app-network
    restart: always

  frontend:
    build: ./frontend
    container_name: cow_detect_frontend
    ports: ["3000:3000"]
    environment: 
      - PORT=3000
      - NODE_ENV=development
      - NUXT_PUBLIC_API_BASE=http://localhost:8000
      - NUXT_API_BASE=http://backend:8000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - NUXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NUXT_PUBLIC_SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge